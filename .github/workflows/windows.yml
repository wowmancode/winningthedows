name: windows-vm
on: workflow_dispatch

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Start Windows container
        env:
          WIN_PASSWORD: ${{ secrets.WIN_PASSWORD }}
        run: |
          docker run -d --name windows \
            -e VERSION=10l -e RAM_SIZE=4G -e CPU_CORES=2 -e DISK_SIZE=25G \
            -e USERNAME=winuser -e PASSWORD="$WIN_PASSWORD" \
            --device=/dev/kvm --device=/dev/net/tun --cap-add NET_ADMIN \
            -p 8006:8006 -p 3389:3389 dockurr/windows

      - name: Open tunnels
        run: |
          cargo install bore-cli
          curl -sLo cloudflared https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x cloudflared
          bore local 3389 --to bore.pub &
          ./cloudflared tunnel --url http://localhost:8006
